name: reworth
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.8
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.1
  path: ^1.8.3
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  shared_preferences: ^2.5.4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.2.2
  url_launcher: ^6.3.2
  image: ^4.8.0
  tflite_flutter: ^0.12.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/reworth_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/reworth_logo.png
    - assets/model_unquant.tflite
    - assets/labels.txt
